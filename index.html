<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini DayZ Three</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud"></div>

    <!-- Debug / world tools: toggled with F3 or the gear button. -->
    <div id="debug" class="hidden">
      <div class="debug-col">
        <div id="info" class="panel"></div>
        <div id="panel" class="panel">
          <label>Seed</label>
          <div class="row">
            <input id="seed" type="text" spellcheck="false" />
            <button id="newWorld">Load</button>
            <button id="randomWorld" title="Random seed">🎲</button>
          </div>
          <label>Teleport (tile X / Y)</label>
          <div class="row">
            <input id="tx" type="number" placeholder="X" />
            <input id="ty" type="number" placeholder="Y" />
            <button id="go">Go</button>
          </div>
          <label>Character (C)</label>
          <div class="row">
            <button id="character" class="wide"></button>
          </div>
        </div>
      </div>
      <canvas id="minimap" width="128" height="128"></canvas>
      <div id="help" class="panel">
        WASD / arrows move · Shift or boot button: run · I / Tab or backpack button: inventory · C switch character · J journal · F3 this panel ·
        F explore mode (fast, no collision) · + / − or mouse wheel / pinch: zoom · M minimap · hover objects to see resources
      </div>
    </div>

    <!-- Inventory: vicinity + equipment, like the original. -->
    <div id="inventory" class="hidden"></div>

    <!-- Journal: survival stats, like the original's Stats tab. -->
    <div id="journal" class="hidden">
      <div class="journal-tab">Stats</div>
      <div class="journal-body">
        <table id="journalStats"></table>
        <div class="journal-hint">J or click to close</div>
      </div>
    </div>

    <div id="tooltip" class="panel"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
